name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: GradeAll
      id: gradeall
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: GradeAll
        setup-command: ''
        command: python3 auto_grade.py
        timeout: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        GRADEALL_RESULTS: "${{steps.gradeall.outputs.result}}"
      with:
        runners: gradeall
